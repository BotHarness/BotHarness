name: publish reviewed npm prerelease

on:
  workflow_dispatch:
    inputs:
      preparation_run:
        description: Successful main-branch manual preparation run ID
        required: true
      source_sha:
        description: Reviewed source SHA (must still be current main)
        required: true
      version:
        description: Reviewed prerelease version
        required: true
      plan_sha256:
        description: Reviewed release-plan.json SHA-256 from preparation summary
        required: true
      resume_partial:
        description: Resume identical reviewed bytes after main advances (matching product component required)
        type: boolean
        default: false
      confirmation:
        description: 'Type: publish VERSION to next (requires Human release approval)'
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-prerelease-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the reviewed preparation provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.preparation_run }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RESUME_PARTIAL: ${{ inputs.resume_partial }}
        run: |
          node --input-type=module - <<'JS'
          import { execFileSync, spawnSync } from 'node:child_process';
          import { copyFileSync } from 'node:fs';
          import { reviewedSource } from './scripts/npm-prerelease-recovery.mjs';
          const { RUN_ID, SOURCE_SHA, GITHUB_REPOSITORY, RESUME_PARTIAL, RUNNER_TEMP } = process.env;
          if (!/^\d+$/.test(RUN_ID) || !/^[a-f0-9]{40}$/.test(SOURCE_SHA)) throw new Error('Invalid reviewed run/SHA');
          const api = (path) => JSON.parse(execFileSync('gh', ['api', path], {encoding:'utf8'}));
          const run = api(`repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}`);
          const main = api(`repos/${GITHUB_REPOSITORY}/commits/main`);
          const checkoutSha = execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const isAncestor = spawnSync('git',['merge-base','--is-ancestor',SOURCE_SHA,checkoutSha]).status === 0;
          reviewedSource({ run, sourceSha: SOURCE_SHA, mainSha: main.sha, checkoutSha, resumePartial: RESUME_PARTIAL === 'true', isAncestor });
          copyFileSync('scripts/npm-prerelease-recovery.mjs', `${RUNNER_TEMP}/npm-prerelease-recovery.mjs`);
          JS
      - name: Check out the original reviewed source without rebuilding
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: npm-prerelease-${{ inputs.version }}
          path: ${{ runner.temp }}/npm-prerelease
          run-id: ${{ inputs.preparation_run }}
          github-token: ${{ github.token }}
      - name: Verify reviewed bytes without publish credentials
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN_SHA: ${{ inputs.plan_sha256 }}
          RESUME_PARTIAL: ${{ inputs.resume_partial }}
        run: |
          node scripts/npm-prerelease.mjs verify --artifacts "$RUNNER_TEMP/npm-prerelease" --version "$RELEASE_VERSION" --source-sha "$SOURCE_SHA" --plan-sha256 "$PLAN_SHA"
          node --input-type=module - <<'JS'
          import { execFileSync } from 'node:child_process';
          import { verifyRelease } from './scripts/npm-prerelease.mjs';
          const { RUNNER_TEMP, RELEASE_VERSION, SOURCE_SHA, PLAN_SHA, RESUME_PARTIAL } = process.env;
          if (execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim() !== SOURCE_SHA) throw new Error('Publisher source differs from reviewed source');
          const release = verifyRelease(`${RUNNER_TEMP}/npm-prerelease`, { version: RELEASE_VERSION, sourceSha: SOURCE_SHA, planSha256: PLAN_SHA, clean: true });
          if (RESUME_PARTIAL === 'true') {
            const { requirePartialPublication } = await import(`${RUNNER_TEMP}/npm-prerelease-recovery.mjs`);
            const existing = await requirePartialPublication(release.packages.map(({ artifact }) => artifact));
            console.log(`Verified partial publication: ${existing.join(', ')}`);
          }
          JS
      - name: Publish dependencies before product and read back integrity
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN_SHA: ${{ inputs.plan_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/npm-prerelease.mjs publish --artifacts "$RUNNER_TEMP/npm-prerelease" --version "$RELEASE_VERSION" --source-sha "$SOURCE_SHA" --plan-sha256 "$PLAN_SHA" --confirm "$CONFIRMATION"
