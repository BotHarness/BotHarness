function crispText(ctx, text, x, y, px, color, threshold = 120) {

  c.letterSpacing = `${Math.max(0.5, px * 0.05).toFixed(1)}px`;
  c.textBaseline = 'middle';
  c.fillStyle = color;
  c.fillText(text, 0, h / 2);
  const img = c.getImageData(0, 0, w, h);
  for (let i = 3; i < img.data.length; i += 4) img.data[i] = img.data[i] > threshold ? 255 : 0;

function measureCJK(text, px) {

function wrapCJK(text, px, maxW) {

  const px = (x, y, c) => { ctx.fillStyle = c; ctx.fillRect(ox + x * s, oy + y * s, s, s); };
  if (id === 'slack') {

        if ((x0 === 4 || x0 === 5) && (y0 === 0) && x0 === 5) continue;
        px(x, y, c);

const MORPH_STAGGER = 0.67;
function planPixels(from, to) {
  const sweep = (set) => {
    const cx = set.reduce((s, p) => s + p.x, 0) / set.length;

    return set.map((p) => ({ p, a: Math.atan2(p.y - cy, p.x - cx), r: Math.hypot(p.x - cx, p.y - cy) }))
      .sort((m, n) => m.a - n.a || m.r - n.r).map((i) => i.p);
  };
  const source = sweep(from);
  const target = sweep(to);
  const count = Math.max(source.length, target.length);
  return Array.from({ length: count }, (_, index) => {
    const a = source[Math.floor((index * source.length) / count)];
    const b = target[Math.floor((index * target.length) / count)];
    const by = Math.floor(a.y / 4);
    const bx = Math.floor(a.x / 4);
    return { from: a, to: b, delay: (by / 8) * 0.28 + ((bx + by) % 2) * 0.04, arc: 2 + ((bx * 3 + by) % 3) };

}

    if (x < 0 || y < 0 || x > 31 || y > 31) continue;
    grid.set(y * 32 + x, { x, y, c: k < 0.5 ? pair.from.c : pair.to.c });

}

function cameraAt(f) {

const SPLIT_W = 108;
function layoutAt(f) {
  const beat = beatAt(f);
  const mode = beat?.mode ?? 'town';
  const prev = beat ? BEATS[BEATS.indexOf(beat) - 1] : null;
  const k = beat && prev && prev.mode !== mode ? ease((f - beat.a) / 18) : 1;
  const target = (m) => ({
    worldW: m === 'split' ? SPLIT_W : VIEW_W,
    dim: m === 'gal' ? 0.62 : 0,
    panel: m === 'split' ? { x: 114, y: 52, w: 200, h: 124 } : m === 'gal' ? { x: 10, y: 50, w: 300, h: 126 } : null,
    dialogBox: m === 'split' ? { x: 114, y: 3, w: 200, h: DIALOG_H } : { x: 6, y: 3, w: 252, h: DIALOG_H },
    mascot: m !== 'split',
  });
  const now = target(mode);
  if (k >= 1 || !prev) return { ...now, beat, k: 1 };
  const was = target(prev.mode);
  return {
    worldW: lerp(was.worldW, now.worldW, k),
    dim: lerp(was.dim, now.dim, k),
    panel: now.panel,
    panelIn: k,
    dialogBox: now.dialogBox,
    mascot: now.mascot,
    beat,
    k,
  };
}

// ----- frame render ------------------------------------------------------------
function renderLegacy(f) {
  const L = layoutAt(f);
  const beat = L.beat;

  // camera
  const [cx, cy, cz] = legacyCamOverride ? [legacyCamOverride.x, legacyCamOverride.y, legacyCamOverride.zoom] : cameraAt(f);
  const worldW = Math.round(L.worldW);
  camera.left = -worldW / 2;
  camera.right = worldW / 2;
  camera.zoom = cz;
  const snap = PIXEL_RATIO * cz;
  camera.position.set(Math.round(cx * snap) / snap, Math.round(cy * snap) / snap, 1000);
  camera.updateProjectionMatrix();

  // cast
  const morphing = MORPH && beat;
  for (const [i, c] of CAST.entries()) {
    const p = actorPos(c.id, f);
    let hop = p.moving ? Math.round(Math.abs(Math.sin(f * 0.38 + i)) * 3) : (f + i * 20) % 60 < 6 ? 1 : 0;
    const waving = within(f, 5770, 5900) || within(f, 6800, 7090);
    if (waving) hop = (f + i * 5) % 14 < 4 ? 2 : 0;
    const ms = MORPH ? morphStateAt(c.id, f) : null;
    if (ms) {
      paintCells(c.live, morphCells(c.id, ms.from, ms.to, ms.t), null);
      swap(c.mesh, c.live);
    } else {
      const turned = c.id === 'nova' && within(f, 3760, 3800);
      swap(c.mesh, turned ? c.tex.turned : c.tex.front);
    }
    place(c.mesh, p.x, p.y + hop, zOf(p.y));
    place(c.shadow, p.x, p.y - 2, 2);
    c.hand.visible = waving;
    if (waving) place(c.hand, p.x + 17, p.y + 18 + ((f + i * 3) % 12 < 6 ? 4 : 0) + hop, zOf(p.y) + 0.05);
    const roleplay = within(f, 4861, 6000);
    c.prop.visible = roleplay;
    if (roleplay) {
      swap(c.prop, c.id === 'nova' ? PROPS.sword : c.id === 'mira' ? PROPS.staff : PROPS.lute);
      let lift = 0;
      if (c.id === 'nova' && within(f, 5060, 5120)) lift = (f >> 2) % 2 ? 6 : 0;
      if (c.id === 'mira' && within(f, 5230, 5300)) lift = 6;
      place(c.prop, p.x + (c.id === 'theo' ? 14 : -15), p.y + 6 + hop + lift, zOf(p.y) + 0.05);
    }
  }
  // human
  const hp = actorPos('human', f);
  const jump = within(f, 5590, 5640) ? [0, 3, 5, 6, 5, 3, 0][Math.floor((f - 5590) / 4) % 7] : 0;
  swap(human.mesh, hp.moving ? humanFrames[1 + (Math.floor(f / 6) % 2)] : jump ? humanFrames[3] : humanFrames[0]);
  place(human.mesh, hp.x, hp.y + (hp.moving ? Math.floor(f / 6) % 2 : 0) + jump);
  place(human.shadow, hp.x, hp.y - 2, 2);
  human.prop.visible = within(f, 4861, 6000);
  if (human.prop.visible) place(human.prop, hp.x + 11, hp.y + 8 + jump, zOf(hp.y) + 0.05);

  // diary + note (memory)
  swap(diaryMesh, within(f, 760, 1800) || within(f, 4700, 4860) ? diaryNoted : diaryPlain);
  place(diaryMesh, LECTERN.x, LECTERN.y + 20, zOf(LECTERN.y) + 0.2);
  const mira = actorPos('mira', f);
  noteMesh.visible = within(f, 704, 760);
  if (noteMesh.visible) {
    const t = span(f, 740, 760);
    place(noteMesh, lerp(mira.x, LECTERN.x - 6, t), lerp(mira.y + 34 + ((f >> 3) % 2), LECTERN.y + 22, t) + Math.sin(t * Math.PI) * 14, 600);
  }

  // market crate: a new bot pops out of an imported Git repository
  const crateOpen = f >= 1880 && f < 2160;
  swap(crateMesh, crateOpen ? crateOpenTex : crateTex);
  const cloned = CROWD[7];
  const popT = span(f, 1880, 1900);
  cloned.mesh.visible = cloned.shadow.visible = within(f, 1880, 2160) || within(f, 6600, 7110);
  if (within(f, 1880, 2160)) {
    const lift = Math.round(Math.sin(popT * Math.PI) * 18);
    const x = lerp(MARKET.x - 2, MARKET.x - 34, popT);
    place(cloned.mesh, x, MARKET.y - 44 + lift, zOf(MARKET.y - 44));
    place(cloned.shadow, x, MARKET.y - 46, 2);
  }

  // connector flags + pigeons
  PLATFORMS.forEach((p, i) => swap(flags[i], flagFrames[i][Math.floor((f + i * 7) / 12) % 2]));
  const PIGEON_RUNS = [
    [2200, 'mira', 0], [2215, 'theo', 1], [2230, 'nova', 2],
    [2600, 'nova', 0], [2700, 'mira', 0], [3020, 'theo', 1], [3140, 'nova', 1],
    [3740, 'lark', 'nova'],
  ];
  pigeons.forEach((pg) => { pg.bird.visible = pg.letter.visible = false; });
  let pgi = 0;
  for (const [start, who, target] of PIGEON_RUNS) {
    const t = span(f, start, start + 70);
    if (t <= 0 || t >= 1 || pgi >= pigeons.length) continue;
    const pg = pigeons[pgi++];
    let from;
    let to;
    let tex;
    if (who === 'lark') {
      const nv = actorPos('nova', f);
      from = [nv.x - 120, nv.y + 80];
      to = [nv.x, nv.y + 36];
      tex = letterTexes.lark;
    } else {
      const a = actorPos(who, f);
      const plat = PLATFORMS[target];
      from = [a.x, a.y + 36];
      to = [plat.x + 12, TOWER.y + 30];
      tex = letterTexes[plat.id];
    }
    pg.bird.visible = false;
    pg.letter.visible = true;
    swap(pg.letter, tex);
    const x = lerp(from[0], to[0], ease(t));
    const y = lerp(from[1], to[1], ease(t)) + Math.sin(t * Math.PI) * 26;
    place(pg.bird, x, y, 650);
    place(pg.letter, x, y + 4 + (Math.floor(f / 6) % 2), 649);
  }

  // slack ZIP crates near Theo
  const theo = actorPos('theo', f);
  zipMeshes[0].visible = within(f, 4100, 4300);
  if (zipMeshes[0].visible) {
    const t = span(f, 4100, 4130);
    place(zipMeshes[0], lerp(theo.x - 40, theo.x - 18, t), theo.y + Math.round(Math.sin(t * Math.PI) * 20), zOf(theo.y) + 0.1);
  }
  zipMeshes[1].visible = within(f, 4300, 4440);
  if (zipMeshes[1].visible) {
    const t = span(f, 4300, 4340);
    place(zipMeshes[1], lerp(theo.x + 18, theo.x + 40, t), theo.y + Math.round(Math.sin(t * Math.PI) * 24), zOf(theo.y) + 0.1);
  }

  // roleplay set pieces
  swap(fireMesh, fireFrames[Math.floor(f / 6) % 3]);
  const slimeAlive = f < 5300 || f >= 6000;
  slimeMesh.visible = slimeAlive;
  swap(slimeMesh, slimeFrames[Math.floor(f / 14) % 2]);
  const flash = within(f, 5250, 5300) && (f >> 2) % 2;
  place(slimeMesh, CAVE.x - 30 + (flash ? 1 : 0), -452);
  poofMesh.visible = within(f, 5300, 5316);
  if (poofMesh.visible) place(poofMesh, CAVE.x - 19, -444, zOf(-452) + 1);
  glowMesh.visible = within(f, 5236, 5300);
  if (glowMesh.visible) {
    swap(glowMesh, glowRingFrames[Math.min(3, Math.floor((f - 5236) / 8) % 4)]);
    place(glowMesh, CAVE.x - 19, -444, zOf(-452) + 1);
  }
  swap(chestMesh, f >= 5585 && f < 6000 ? chestOpen : chestClosed);
  musicNotes.forEach((m, i) => {
    const t = (f - 5400 - i * 18) % 60;
    m.visible = within(f, 5400, 5560) && t >= 0;
    if (m.visible) place(m, theo.x + 10 + Math.round(Math.sin(t * 0.15 + i) * 4), theo.y + 30 + t / 2, 660);
  });
  fireflies.forEach((m, i) => {
    m.visible = within(f, 4861, 6000) && (f + i * 9) % 50 < 40;
    if (m.visible) place(m, -180 + ((i * 47) % 320) + Math.round(Math.sin(f * 0.03 + i) * 10), -470 + ((i * 29) % 90) + Math.round(Math.cos(f * 0.04 + i) * 6), 660);
  });
  sparks.forEach((m, i) => {
    const chest = within(f, 5590, 5700);
    const clone = within(f, 1880, 1930);
    m.visible = (chest || clone) && (f + i * 3) % 8 < 5;
    if (!m.visible) return;
    const [ox, oy] = chest ? [CAVE.x + 32, -466] : [MARKET.x - 20, MARKET.y - 30];
    const a = i * 0.63 + f * 0.05;
    place(m, ox + Math.round(Math.cos(a) * (10 + (i % 3) * 5)), oy + 8 + Math.round(Math.sin(a) * (8 + (i % 4) * 3)), 660);
  });

  // finale crowd walking around the town
  const crowdOn = within(f, 6600, 7110);
  CROWD.forEach((c, i) => {
    if (i === 7 && within(f, 1880, 2160)) return;
    c.mesh.visible = c.shadow.visible = crowdOn;
    if (!crowdOn) return;
    const loopLen = 1200;
    const u = ((f - 6600) * (0.6 + (i % 5) * 0.12) + i * 97) % loopLen / loopLen;
    const lane = i % 4;
    const rx = 120 + lane * 50 + (i % 3) * 8;
    const ry = 70 + lane * 26;
    const x = Math.round(Math.cos(u * Math.PI * 2) * rx);
    const y = Math.round(28 + Math.sin(u * Math.PI * 2) * ry);
    const hop = Math.round(Math.abs(Math.sin(f * 0.3 + i)) * 2);
    place(c.mesh, x, y + hop, zOf(y));
    place(c.shadow, x, y - 2, 2);
  });

  // world bubbles
  let k = 0;
  for (const bb of bubblePool) bb.visible = false;
  for (const b of BUBBLES) {
    if (!within(f, b.a, b.b) || k >= bubblePool.length) continue;
    const m = bubblePool[k++];
    const who = CAST.find((c) => c.id === b.who);
    const t = bubbleTex(b.text, b.signer?.[0] ?? who.name, b.signer?.[1] ?? who.tag);
    swap(m, t);
    m.geometry = geometry(t.w, t.h, 0, 0);
    const q = actorPos(b.who, f);
    const s = popScale(f, b.a, b.b);
    m.visible = s > 0;
    m.scale.set(s, s, 1);
    place(m, q.x - 6, q.y + 34, 700 + k);
  }

  // ----- HUD -----
  const night = within(f, 4861, 6000);
  nightOverlay.visible = night;
  if (night) { setRect(nightOverlay, 0, 0, L.worldW, VIEW_H); nightOverlay.material.opacity = 0.38; }
  dimOverlay.visible = L.dim > 0.01;
  if (dimOverlay.visible) { setRect(dimOverlay, 0, 0, VIEW_W, VIEW_H); dimOverlay.material.opacity = step8(L.dim); }
  const splitOn = L.worldW < VIEW_W - 0.5;
  rightBg.visible = divider.visible = splitOn;
  if (splitOn) {
    setRect(rightBg, L.worldW, 0, VIEW_W - L.worldW, VIEW_H);
    rightBg.material.opacity = 1;
    setRect(divider, L.worldW, 0, 1, VIEW_H);
    divider.material.opacity = 1;
  }

  renderConnGraph(f);
  if (within(f, 2186, 2520)) { dimOverlay.visible = true; setRect(dimOverlay, 0, 0, VIEW_W, VIEW_H); dimOverlay.material.opacity = step8(span(f, 2186, 2214) * 0.84); }

  // UI panel
  const ui = beat?.ui ? UI[beat.ui] : null;
  const showPanel = ui && L.panel;
  panelFrame.visible = panelImage.visible = !!showPanel;
  for (const h of hlLines) h.visible = false;
  pointer.visible = false;
  if (showPanel) {
    const P = { ...L.panel };
    const slide = L.panelIn !== undefined ? 1 - L.panelIn : 0;
    P.x += Math.round(slide * 220);
    const ft = frameTex(P.w, P.h, ui.title);
    panelFrame.material.map = ft.tex;
    panelFrame.material.needsUpdate = true;
    panelFrame.position.set(P.x, P.y, 0);
    panelFrame.scale.set(P.w, P.h, 1);
    const IA = { x: P.x + 1, y: P.y + 1, w: P.w - 2, h: P.h - 11 };
    const aspect = IA.w / IA.h;
    // crop keys (ease between neighbours)
    let crop = beat.crops[0].slice(1);
    for (let i = 1; i < beat.crops.length; i++) {
      const [f1, ...c1] = beat.crops[i];
      const [f0, ...c0] = beat.crops[i - 1];
      if (f >= f1) crop = c1;
      else if (f >= f0) { const t = ease(span(f, f1 - 40, f1)); crop = c0.map((v, j) => lerp(v, c1[j], t)); break; }
    }
    let [ccx, ccy, cw] = crop;
    let ch = cw / aspect;
    if (ch > ui.h) { ch = ui.h; cw = ch * aspect; }
    if (cw > ui.w) { cw = ui.w; ch = cw / aspect; }
    const x0 = clamp(ccx - cw / 2, Math.min(0, ui.w - cw), Math.max(0, ui.w - cw));
    const y0 = clamp(ccy - ch / 2, Math.min(0, ui.h - ch), Math.max(0, ui.h - ch));
    if (ui.clip) {
      const t = clipTime(beat, f);
      if (Math.abs(ui.video.currentTime - t) > 0.0005) ui.video.currentTime = t;
      drawClip(ui);
    }
    const tex = ui.tex;
    if (panelImage.material.map !== tex) { panelImage.material.map = tex; panelImage.material.needsUpdate = true; }
    tex.repeat.set(cw / ui.w, ch / ui.h);
    tex.offset.set(x0 / ui.w, 1 - (y0 + ch) / ui.h);
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    // letterbox when the crop is wider/taller than the image
    const drawW = Math.min(IA.w, (ui.w / cw) * IA.w);
    const drawH = Math.min(IA.h, (ui.h / ch) * IA.h);
    panelImage.position.set(IA.x + (IA.w - drawW) / 2, IA.y + (IA.h - drawH) / 2, 0);
    panelImage.scale.set(drawW, drawH, 1);
    panelImage.material.opacity = 1;
    const toPanel = (sx, sy) => [IA.x + ((sx - x0) / cw) * IA.w, IA.y + IA.h - ((sy - y0) / ch) * IA.h];
    for (const [h0, h1, hx, hy, hw, hh] of beat.hl ?? []) {
      if (!within(f, h0, h1)) continue;
      const on = (f - h0) % 40 < 30;
      if (!on) continue;
      const [ax, ay] = toPanel(hx, hy);
      const [bx, by2] = toPanel(hx + hw, hy + hh);
      const l = clamp(Math.round(ax), IA.x, IA.x + IA.w);
      const r = clamp(Math.round(bx), IA.x, IA.x + IA.w);
      const t = clamp(Math.round(ay), IA.y, IA.y + IA.h);
      const b2 = clamp(Math.round(by2), IA.y, IA.y + IA.h);
      setRect(hlLines[0], l, b2, r - l, 1);
      setRect(hlLines[1], l, t - 1, r - l, 1);
      setRect(hlLines[2], l, b2, 1, t - b2);
      setRect(hlLines[3], r - 1, b2, 1, t - b2);
      for (const h of hlLines) { h.visible = true; h.material.opacity = 1; }
      const pt = ease(span(f, h0, h0 + 24));
      pointer.visible = true;
      pointer.position.set(Math.round(lerp(IA.x + IA.w - 8, r - 6, pt)), Math.round(lerp(IA.y + 12, b2 + 4, pt)), 0);
      break;
    }
  }

  // narration dialog
  let line = null;
  for (const l of beat?.lines ?? []) if (f >= l[0]) line = l;
  const dialogOn = !!line && beat && !beat.finale;
  dialog.mesh.visible = dialogOn;
  mascot.visible = dialogOn && L.mascot && (!line || line[1] === NARRATOR);
  if (dialogOn) {
    const D = L.dialogBox;
    const shown = Math.floor((f - line[0]) / TYPE_FRAMES) + 1;
    drawDialog(D.w, D.h, line[1], line[2], shown);
    const pop = Math.min(1, (f - beat.a) / 8);
    dialog.mesh.position.set(D.x, D.y - Math.round((1 - pop) * 12), 0);
    dialog.mesh.scale.set(D.w, D.h + 8, 1);
    if (mascot.visible) placeMascot(f);
  }
  plannedChip.visible = !!beat?.tag && within(f, beat.tag[0], beat.tag[1]);
  if (plannedChip.visible) plannedChip.position.set(L.dialogBox.x + L.dialogBox.w - 40, L.dialogBox.y + L.dialogBox.h - 2, 0);

  // morph showcase tiles
  const show = beat?.morphShow && MORPH;
  for (const [i, c] of CAST.entries()) {
    const bt = bigTiles[i];
    bt.m.visible = bigLabels[i].visible = !!show;
    if (!show) continue;
    const ms = morphStateAt(c.id, f);
    paintCells(bt.t, ms ? morphCells(c.id, ms.from, ms.to, ms.t) : MORPH[c.id].face, MORPH[c.id].tile);
    const x = 160 + (i - 1) * 84;
    const pop = popScale(f, beat.a + i * 6, beat.b);
    bt.m.scale.set(2 * pop, 2 * pop, 1);
    bt.m.position.set(x, 64, 0);
    bigLabels[i].position.set(x, 62, 0);
    bigLabels[i].visible = pop >= 1;
  }
  if (show) { dimOverlay.visible = true; setRect(dimOverlay, 0, 0, VIEW_W, VIEW_H); dimOverlay.material.opacity = 0.5; }

  // finale: face wall, then logo + open source line
  const wallOn = within(f, 6000, 6720);
  wall.forEach((m, i) => {
    const col = i % 10;
    const row = Math.floor(i / 10);
    const appear = 6010 + (col + row) * 8;
    m.visible = wallOn && f >= appear;
    if (!m.visible) return;
    const s = Math.min(1, POP[Math.min(5, Math.floor((f - appear) / 2))] ?? 1);
    const wob = Math.floor((f + i * 7) / 30) % 2;
    m.scale.set(s, s, 1);
    m.position.set(16 + col * 32, VIEW_H - 15 - row * 31 + wob, 0);
  });
  wallDim.visible = within(f, 6300, 6720);
  if (wallDim.visible) { setRect(wallDim, 0, 0, VIEW_W, VIEW_H); wallDim.material.opacity = step8(span(f, 6300, 6340) * 0.72); }
  const endOn = within(f, 6330, 6720);
  endText.visible = endOn;
  if (endOn) endText.position.set(VIEW_H > 0 ? 160 : 0, 92, 0);

  // title card (start and end of the loop)
  const titleA = f < 90 ? 1 - step8(span(f, 60, 90)) : 0;
  const titleB = f >= 7110 ? step8(span(f, 7110, 7140)) : 0;
  const finaleLogo = within(f, 6330, 6720) ? step8(span(f, 6330, 6360)) : 0;
  const titleAlpha = Math.max(titleA, titleB);
  titleBg.visible = titleAlpha > 0;
  if (titleBg.visible) { setRect(titleBg, 0, 0, VIEW_W, VIEW_H); titleBg.material.opacity = titleAlpha; }
  const logoAlpha = Math.max(titleAlpha, finaleLogo);
  titleLogo.visible = titleText.visible = logoAlpha > 0;
  if (titleLogo.visible) {
    const atEnd = finaleLogo > 0 && titleAlpha === 0;
    const size = atEnd ? 48 : 64;
    titleLogo.position.set(160 - size / 2, atEnd ? 112 : 92, 0);
    titleLogo.scale.set(size, size, 1);
    titleLogo.material.opacity = logoAlpha;
    titleText.position.set(160, atEnd ? 110 : 88, 0);
    titleText.material.opacity = logoAlpha;
    titleText.visible = !atEnd || true;
    if (atEnd) titleText.visible = false;
  }
  fadeQuad.visible = false;


  // draw: world into its viewport, then HUD over the full frame
  renderer.setScissorTest(true);
  renderer.setViewport(0, 0, worldW * PIXEL_RATIO, VIEW_H * PIXEL_RATIO);
  renderer.setScissor(0, 0, worldW * PIXEL_RATIO, VIEW_H * PIXEL_RATIO);
  renderer.setClearColor('#1b1820');
  renderer.clear();
  renderer.render(scene, camera);
  renderer.setViewport(0, 0, VIEW_W * PIXEL_RATIO, VIEW_H * PIXEL_RATIO);
  renderer.setScissor(0, 0, VIEW_W * PIXEL_RATIO, VIEW_H * PIXEL_RATIO);
  renderer.clearDepth();
  renderer.render(hud, hudCam);
  renderer.setScissorTest(false);
  renderMemStage(f, worldW);
}

// ===== master timeline =============================================================
// legacy segments replay the town film by its own frame numbers; the others are new modules
const SEGMENTS = [
  { id: 'hook', len: 900 }, // HOOK_LEN
  { id: 'legacy', len: 520, from: 200 },
  { id: 'legacy', len: 1650, from: 720, rate: 1080 / 1650 }, // Memory, slowed so every panel can be read
  { id: 'legacy', len: 240, from: 1800 },
  { id: 'market', len: 1810, rate: 2160 / 1810 },
  { id: 'legacy', len: 3490, from: 2160, rate: 3780 / 3490 },
  { id: 'wall', len: 390, rate: 480 / 390 },
  { id: 'eco', len: 660, rate: 840 / 660 },
  { id: 'city', len: 840, rate: 1080 / 840 },
  { id: 'end', len: 300 + TOTAL - 10800 },
];
let segStart = 0;
for (const sg of SEGMENTS) { sg.start = segStart; segStart += sg.len; }
if (segStart !== TOTAL) console.warn('TOTAL mismatch', segStart, TOTAL);
function segmentAt(F) {
  return SEGMENTS.find((sg) => F >= sg.start && F < sg.start + sg.len);
}

function hudPlane(target, t, order, ax = 0, ay = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1).translate(0.5 - ax, 0.5 - ay, 0), new THREE.MeshBasicMaterial({ map: t?.tex ?? null, transparent: true, depthTest: false, depthWrite: false }));
  m.renderOrder = order;
  target.add(m);
  return m;
}
function setPlane(m, x, y, w, h, opacity = 1) {
  m.visible = true;
  m.position.set(Math.round(x), Math.round(y), 0);
  m.scale.set(w, h, 1);
  m.material.opacity = opacity;
}
function narrate(f, lines, box = { x: 6, y: 3, w: 252, h: DIALOG_H }, mascotOn = true) {
  let line = null;
  for (const l of lines) if (f >= l[0]) line = l;
  if (!line) return null;
  const [start, speaker, text] = line;
  drawDialog(box.w, box.h, speaker, text, Math.floor((f - start) / TYPE_FRAMES) + 1);
  dialog.mesh.visible = true;
  const pop = Math.min(1, (f - lines[0][0]) / 8);
  dialog.mesh.position.set(box.x, box.y - Math.round((1 - pop) * 12), 0);
  dialog.mesh.scale.set(box.w, box.h + 8, 1);
  if (mascotOn && speaker === NARRATOR) {
    mascot.visible = true;
    placeMascot(f);
  }
  return line;
}

// ----- soul: Mira's face cells, lifted into light (no redraw) ----------------------
let soulTex = null;
function makeSoul() {
  if (soulTex || !MORPH) return soulTex;
  soulTex = canvasTex(36, 36, (ctx) => {

function stickerCanvas(src, w, h, { smooth = false, margin = 2, into = null } = {}) {
  const W = w + margin * 2 + 3;
