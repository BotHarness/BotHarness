<!doctype html>
<!-- 原型说明（不渲染）：footer 常驻模式切换；选中 Bot = 对话 + 事件流（参考 DSH trace）；
     未选中主区 = BOT dashboard（KPI + 事件趋势图 + 全局 inbox；真实实现用 TanStack Charts）。
     图标 HugeIcons 内联；头像 blobatar（esm.sh，离线回退）。throwaway。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>原型 · BotHarness 模式 + Dashboard</title>
    <style>
      :root {
        --bg: #ffffff;
        --side: #f7f8fa;
        --ink: #1c1f24;
        --muted: #8a9099;
        --line: #e8eaed;
        --accent: #4f46e5;
        --state-thinking: #3b82f6;
        --state-working: #16a34a;
        --state-waiting: #d97706;
        --state-blocked: #dc2626;
        --state-idle: #9ca3af;
        --state-done: #94a3b8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font:
          13px/1.5 -apple-system,
          'Segoe UI',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        overflow: hidden;
      }
      #app {
        display: flex;
        height: 100vh;
        height: 100dvh;
      }
      .brand {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px 10px;
        font-weight: 700;
      }
      .brand .mark {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: linear-gradient(135deg, #4f46e5, #22d3ee);
      }
      .panel-row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 7px 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #374151;
        cursor: pointer;
        font: inherit;
        text-align: left;
      }
      .panel-row:hover {
        background: #eef0f3;
      }
      .panel-row.active {
        background: #e6e9ff;
        font-weight: 600;
      }
      .panel-row .grow {
        flex: 1;
        text-align: left;
      }
      .panels {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px 8px;
        border-top: 1px solid var(--line);
      }

      .sidebar {
        width: 296px;
        flex: 0 0 296px;
        background: var(--side);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: 100%;
        overflow: hidden;
      }
      .region {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 10px 10px 4px;
      }
      .side-foot {
        flex: 0 0 auto;
        border-top: 1px solid var(--line);
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .mode-switch {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        color: #374151;
      }
      .mode-switch:hover {
        background: #f3f4f6;
      }
      .mode-switch .grow {
        flex: 1;
        text-align: left;
        font-weight: 600;
      }
      .mode-switch .kbd {
        font-size: 10px;
        color: var(--muted);
      }

      .search-row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 10px;
      }
      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 9px;
        color: var(--muted);
      }
      .search-box input {
        border: 0;
        outline: none;
        background: transparent;
        font: inherit;
        color: var(--ink);
        width: 100%;
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: #4b5563;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .icon-btn:hover {
        background: #f3f4f6;
      }
      .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }
      .icon svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .pinned-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 8px;
        margin-bottom: 12px;
      }
      .pinned {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 4px;
        border-radius: 10px;
        cursor: pointer;
        position: relative;
      }
      .pinned:hover {
        background: #eef0f3;
      }
      .pinned.selected {
        background: #e6e9ff;
      }
      .pinned .name {
        font-size: 12px;
        font-weight: 600;
      }
      .tag {
        font-size: 10px;
        color: #6b7280;
        background: #eceef1;
        border-radius: 5px;
        padding: 1px 5px;
      }
      .blob {
        display: inline-flex;
        flex: 0 0 auto;
      }
      .blob svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .presence {
        position: absolute;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        border: 2px solid var(--side);
      }
      .presence.working {
        background: var(--state-working);
      }
      .presence.waiting {
        background: var(--state-waiting);
      }
      .presence.blocked {
        background: var(--state-blocked);
      }

      .side-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 4px 4px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        user-select: none;
      }
      .side-head.clickable {
        cursor: pointer;
      }
      .side-head .count {
        font-size: 11px;
        background: #e9ebef;
        border-radius: 999px;
        padding: 0 7px;
        color: #4b5563;
        letter-spacing: 0;
        text-transform: none;
      }
      .side-head .count.warn {
        background: #fef3c7;
        color: #b45309;
      }
      .side-head .chev {
        margin-left: auto;
        font-size: 10px;
        color: #a1a7b0;
      }

      .contact {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 6px;
        border-radius: 8px;
        cursor: pointer;
      }
      .contact:hover {
        background: #eef0f3;
      }
      .contact.selected {
        background: #e6e9ff;
      }
      .contact .body {
        min-width: 0;
        flex: 1;
      }
      .contact .top {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .contact .name {
        font-weight: 600;
      }
      .contact .msg {
        color: var(--muted);
        font-size: 11.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .contact .when {
        color: var(--muted);
        font-size: 11px;
        flex: 0 0 auto;
      }
      .contact .unread {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--state-thinking);
        flex: 0 0 auto;
      }

      .ws-row {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 6px 6px;
        border-radius: 7px;
        cursor: pointer;
        color: #374151;
      }
      .ws-row:hover,
      .sess-row:hover {
        background: #eef0f3;
      }
      .ws-row .name {
        font-weight: 600;
      }
      .ws-row .meta {
        margin-left: auto;
        color: var(--muted);
        font-size: 11px;
      }
      .sess-row {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 6px 5px 12px;
        border-radius: 7px;
        cursor: pointer;
      }
      .sess-row.selected {
        background: #e6e9ff;
      }
      .sess-row .body {
        min-width: 0;
        flex: 1;
      }
      .sess-row .title {
        font-size: 12.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sess-row .progress {
        color: var(--muted);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sess-state {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--muted);
        flex: 0 0 auto;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--state-idle);
        flex: 0 0 auto;
      }
      .dot[data-state='thinking'] {
        background: var(--state-thinking);
      }
      .dot[data-state='working'] {
        background: var(--state-working);
      }
      .dot[data-state='waiting'] {
        background: var(--state-waiting);
      }
      .dot[data-state='blocked'] {
        background: var(--state-blocked);
      }
      .dot[data-state='done'] {
        background: var(--state-done);
      }
      .sess-state[data-state='waiting'],
      .sess-state[data-state='blocked'] {
        color: #b45309;
        font-weight: 600;
      }

      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--line);
        flex: 0 0 auto;
      }
      .topbar .title {
        font-weight: 600;
      }
      .topbar .crumb {
        color: var(--muted);
      }
      .topbar .pill {
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
        background: #f1f2f4;
        border-radius: 999px;
        padding: 3px 10px;
      }
      .content {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .placeholder {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        flex-direction: column;
        gap: 6px;
        text-align: center;
      }
      .placeholder .big {
        font-size: 15px;
        color: #6b7280;
      }

      /* Dashboard */
      .dash {
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .dash h2 {
        margin: 0;
        font-size: 16px;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .kpi {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .kpi .num {
        font-size: 22px;
        font-weight: 700;
      }
      .kpi .lbl {
        color: var(--muted);
        font-size: 12px;
      }
      .kpi.warn .num {
        color: var(--state-waiting);
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .panel h3 {
        margin: 0 0 8px;
        font-size: 13px;
      }
      .panel .sub {
        color: var(--muted);
        font-size: 11px;
        font-weight: 400;
        margin-left: 6px;
      }
      .legend {
        display: flex;
        gap: 12px;
        color: var(--muted);
        font-size: 11px;
        margin-top: 6px;
      }
      .legend .sw {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        margin-right: 4px;
      }
      .inbox-list {
        display: flex;
        flex-direction: column;
      }
      .inbox-row {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 2px;
        border-top: 1px solid #f3f4f6;
      }
      .inbox-row:first-child {
        border-top: 0;
      }
      .inbox-row .body {
        flex: 1;
        min-width: 0;
      }
      .inbox-row .t {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .inbox-row .when {
        color: var(--muted);
        font-size: 11px;
      }
      .btn {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        border-radius: 7px;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .badge {
        font-size: 10px;
        border-radius: 5px;
        padding: 1px 6px;
        background: #eef0f3;
        color: #4b5563;
      }
      .badge.lark {
        background: #e0f2fe;
        color: #0369a1;
      }
      .badge.channel {
        background: #ede9fe;
        color: #6d28d9;
      }
      .badge.session {
        background: #dcfce7;
        color: #15803d;
      }
      .badge.system {
        background: #f1f2f4;
        color: #4b5563;
      }
      .badge.human {
        background: #ffedd5;
        color: #c2410c;
      }
      .badge.need {
        background: #fef3c7;
        color: #b45309;
      }

      /* Bot view：chat + events */
      .bot-view {
        display: flex;
        height: 100%;
        min-height: 0;
      }
      .chat-pane {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
      }
      .chat-scroll {
        flex: 1;
        overflow: auto;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .bubble {
        max-width: 72%;
        border-radius: 12px;
        padding: 9px 12px;
        font-size: 13px;
      }
      .bubble.bot {
        background: #f1f2f4;
        align-self: flex-start;
      }
      .bubble.me {
        background: #e6e9ff;
        align-self: flex-end;
      }
      .composer {
        border-top: 1px solid var(--line);
        padding: 10px 14px;
        color: var(--muted);
        font-size: 12px;
      }
      .events-pane {
        width: 380px;
        flex: 0 0 380px;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .events-head {
        padding: 12px 14px 8px;
        border-bottom: 1px solid var(--line);
      }
      .events-head h3 {
        margin: 0 0 8px;
        font-size: 13px;
      }
      .filters {
        display: flex;
        gap: 6px;
      }
      .chip {
        font-size: 11px;
        color: #374151;
        background: #f1f2f4;
        border-radius: 999px;
        padding: 2px 9px;
        cursor: pointer;
      }
      .chip.on {
        background: #111827;
        color: #fff;
      }
      .events {
        flex: 1;
        overflow: auto;
        padding: 8px 14px 14px;
      }
      .event {
        display: flex;
        gap: 9px;
        padding: 9px 0;
        border-bottom: 1px solid #f3f4f6;
      }
      .event.unread .t {
        font-weight: 600;
      }
      .event .body {
        flex: 1;
        min-width: 0;
      }
      .event .t {
        font-size: 12.5px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .event .meta {
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }
      .event .when {
        color: var(--muted);
        font-size: 11px;
        flex: 0 0 auto;
      }
      .event .actions {
        margin-top: 6px;
      }
      .event .unread-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--state-thinking);
        flex: 0 0 auto;
        margin-top: 6px;
      }

      .prototype-flag {
        position: fixed;
        top: 10px;
        right: 12px;
        z-index: 50;
        font-size: 11px;
        letter-spacing: 0.08em;
        background: #111827;
        color: #f9fafb;
        padding: 3px 8px;
        border-radius: 6px;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="prototype-flag">PROTOTYPE</div>
    <div id="app"></div>
    <script type="module">

      function areaChart(series) {
        const W = 560,
          H = 150,
          PAD = 26;
        const max = Math.max(1, ...series.flatMap((s) => s.points));
        const step = (W - PAD * 2) / (series[0].points.length - 1);
        const y = (v) => H - PAD - (v / max) * (H - PAD * 2);
        const paths = series
          .map((s) => {
            const line = s.points
              .map(
                (v, i) =>
                  (i === 0 ? 'M' : 'L') + (PAD + i * step).toFixed(1) + ' ' + y(v).toFixed(1),
              )
              .join(' ');
            const area =
              line + ' L' + (W - PAD) + ' ' + (H - PAD) + ' L' + PAD + ' ' + (H - PAD) + ' Z';
            return (
              '<path d="' +
              area +
              '" fill="' +
              s.color +
              '22" stroke="none"></path><path d="' +
              line +
              '" fill="none" stroke="' +
              s.color +
              '" stroke-width="1.8" stroke-linejoin="round"></path>'
            );
          })
          .join('');
        const grid = [0, 1, 2, 3]
          .map((i) => {
            const gy = PAD + ((H - PAD * 2) / 3) * i;
            return (
              '<line x1="' +
              PAD +
              '" y1="' +
              gy +
              '" x2="' +
              (W - PAD) +
              '" y2="' +
              gy +
              '" stroke="#eef0f3" stroke-width="1"></line>'
            );
          })
          .join('');
        const ticks = ['00:00', '06:00', '12:00', '18:00', '24:00']
          .map(
            (label, i) =>
              '<text x="' +
              (PAD + ((W - PAD * 2) / 4) * i) +

              (H - 6) +
              '" font-size="10" fill="#8a9099" text-anchor="middle">' +
              label +
              '</text>',
          )
          .join('');
        return (
          '<svg viewBox="0 0 ' +
          W +
          ' ' +
          H +
          '" width="100%" height="150" preserveAspectRatio="none">' +
          grid +
          paths +
          ticks +
          '</svg>'
        );
      }

              .map(
                (session) =>
                  '<div class="sess-row"><span class="dot" data-state="' +
                  session.state +
                  '"></span>' +
                  '<div class="body"><div class="title">' +
                  esc(session.title) +
                  '</div></div><span style="color:var(--muted);font-size:11px">' +
                  esc(session.updated) +
                  '</span></div>',
              )
              .join(''),
        ).join('');
        return (
          '<div class="region"><div class="side-head">工作区 <span class="count">' +
          WORKSPACES.length +
          '</span></div>' +
          rows +
          '</div>'
        );
      }

      function renderMain() {
        if (ui.mode === 'dsh') {
          return (
            '<div class="main"><div class="topbar"><span class="title">会话</span><span class="pill">DSH 原有界面</span></div>' +
            '<div class="content"><div class="placeholder"><div class="big">DSH 工作区视图</div><div>footer 按钮可随时切回 PersonaBots 模式</div></div></div></div>'
          );
        }
        if (ui.selectedSession) {
          const found = sessionOf(ui.selectedSession);
          const bot = botOf(found.session.bot);
          return (
            '<div class="main"><div class="topbar">' +
            blob(bot.slug, 22) +
            '<span class="crumb">' +
            esc(bot.name) +
            ' / ' +
            esc(found.workspace.name) +
            '</span>' +
            '<span class="title">' +
            esc(found.session.title) +
            '</span><span class="pill">' +
            STATE[found.session.state].label +
            '</span></div>' +
            '<div class="content"><div class="placeholder">' +
            blob(bot.slug, 72) +
            '<div class="big">' +
            esc(found.session.title) +
            '</div>' +
            '<div>' +
            esc(found.session.progress) +
            '</div><div style="margin-top:6px;color:#9ca3af">DSH 原本的会话视图 · 右侧可后续加记忆/审批</div></div></div></div>'
          );
        }
        if (ui.selectedBot) return renderBotView(botOf(ui.selectedBot));
        return renderDashboard();
      }

      function renderSidebar(regionHtml) {
        const active = (key) =>
          (ui.mode === 'bot' && key === 'personabots') || (ui.mode === 'dsh' && key === 'chat')
            ? ' active'
            : '';
        const panel = (key, name, label) =>
          '<button class="panel-row' +
          active(key) +
          '" data-act="panel" data-key="' +
          key +
          '">' +
          icon(name, 16) +
          '<span class="grow">' +
          label +
          '</span></button>';
        return (
          '<div class="sidebar">' +
          '<div class="brand"><span class="mark"></span><span class="brand-name">DeepSeek Harness</span></div>' +
          regionHtml +
          '<div class="panels">' +
          panel('chat', 'chat', '会话') +
          panel('files', 'plug', '文件') +
          panel('personabots', 'robot', 'PersonaBots') +
          '</div>' +
          '<div class="side-foot">' +
          '<button class="mode-switch" data-act="toggle-mode">' +
          icon(ui.mode === 'bot' ? 'chat' : 'robot', 15) +
          '<span class="grow">' +
          (ui.mode === 'bot' ? '切回 DSH 工作区' : '打开 PersonaBots') +
          '</span><span class="kbd">常驻</span></button>' +
          '<button class="panel-row" data-act="noop">' +
          icon('settings', 16) +
          '<span class="grow">设置</span></button>' +
          '</div></div>'
        );
      }

      function render() {
        document.getElementById('app').innerHTML =
          renderSidebar(ui.mode === 'bot' ? renderBotSidebar() : renderDshSidebar()) + renderMain();
        const search = document.getElementById('search');
        if (search) {
          search.addEventListener('input', (event) => {
            ui.query = event.target.value;
            render();
            const next = document.getElementById('search');
            if (next) {
              next.focus();
              next.setSelectionRange(next.value.length, next.value.length);
            }
          });
        }
      }

      document.getElementById('app').addEventListener('click', (event) => {
        const cell = event.target.closest('[data-act]');
        if (!cell) return;
        const act = cell.dataset.act;
        if (act === 'toggle-mode') {
          ui.mode = ui.mode === 'bot' ? 'dsh' : 'bot';
          ui.selectedBot = null;
          ui.selectedSession = null;
        }
        if (act === 'go-dashboard') {
          ui.mode = 'bot';
          ui.selectedBot = null;
          ui.selectedSession = null;
        }
        if (act === 'panel') {
          ui.mode = cell.dataset.key === 'personabots' ? 'bot' : 'dsh';
          ui.selectedBot = null;
          ui.selectedSession = null;
        }
        if (act === 'select-bot' || act === 'open-bot') {
          ui.selectedBot = cell.dataset.slug;
          ui.selectedSession = null;
        }
        if (act === 'select-session') {
          ui.selectedSession = cell.dataset.id;
          ui.selectedBot = sessionOf(cell.dataset.id).session.bot;
        }
        if (act === 'toggle-ws') {
          const name = cell.dataset.name;
          ui.wsOpen[name] = ui.wsOpen[name] === false;
        }
        if (act === 'event-filter') ui.eventFilter = cell.dataset.key;
        render();
      });

      render();
    </script>
  </body>
</html>
