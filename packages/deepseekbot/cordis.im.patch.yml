- insert:
    - id: xmanrui-dsh-im
      name: '@botharness/im-provider'
    - id: botharness-core
      name: '@botharness/core'
    - id: botharness-client
      name: '@botharness/ui'
    # Browser use (ADR-0089): the profile-scoped managed Bot Browser. No
    # official seam is composed; the plugin registers its own tools in the
    # session scopes where Browser Access is on.
    - id: botharness-browser
      name: '@botharness/browser'
    # Official computer-use seam (ADR-0079): one exclusive provider slot our
    # Computer Tool Provider registers. The service has no config.
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
    - id: botharness-computer
      name: '@botharness/computer'
      config:
        target: local
